# PQ-DRIFTLAB lab (see lab/README.md for the safety rules).
#
# One internal network (no route out), a server, a one-shot client, and a tcpdump sidecar that shares
# the server's network namespace (captures are copied to ./data/pcaps, git-ignored, by lab/run_matrix.sh).
#
# Profile via env (no defaults hidden elsewhere):
#   KEM=X25519 AUTH=ecdsa_p256 CHAIN=leaf_int docker compose up -d server capture
#   docker compose run --rm client
#   docker compose down -v
name: pqdl-lab

networks:
  lab:
    internal: true        # no external access; nothing here publishes ports to the host

volumes:
  certs: {}               # private throwaway PKI, generated by the server on first start

x-profile: &profile
  KEM: ${KEM:-X25519}
  AUTH: ${AUTH:-ecdsa_p256}
  CHAIN: ${CHAIN:-leaf_int}

services:
  server:
    build: { context: ./lab, target: lab }
    image: pqdl-lab:openssl-3.5.9
    hostname: server
    command: ["/lab/run_server.sh"]
    environment:
      <<: *profile
      TICKETS: ${TICKETS:-0}      # 0 = session tickets disabled (default); 1 = enabled
    volumes: ["certs:/certs"]
    networks: [lab]

  capture:
    build: { context: ./lab, target: capture }
    image: pqdl-capture:tcpdump
    network_mode: "service:server"      # same network namespace as the server
    depends_on: [server]
    cap_add: [NET_RAW, NET_ADMIN]
    # Written INSIDE this container (fast local disk) and copied out by lab/run_matrix.sh after tcpdump exits:
    # writing per packet (-U) to a Windows bind mount was too slow and the kernel dropped packets.
    # -B: 32 MB capture buffer. -Z root: keep write access. tcpdump flushes its file on SIGTERM.
    # offload_off.sh turns off GRO/GSO/TSO/LRO on the SERVER's eth0 (shared namespace) before tcpdump starts, and
    # prints whether that worked; tcpdump is exec'd after it so the capture only ever sees the new setting.
    command: ["bash", "-c", "/lab/offload_off.sh server eth0; exec tcpdump -i eth0 -n -B 32768 -Z root -w /tmp/${PCAP_NAME:-lab.pcap}"]

  client:
    image: pqdl-lab:openssl-3.5.9
    command: ["/lab/run_client.sh"]
    cap_add: [NET_ADMIN]          # lets the workloads turn off the client's NIC offloads (lab/offload_off.sh)
    environment: *profile
    depends_on: [server, capture]
    volumes: ["certs:/certs:ro"]
    networks: [lab]
